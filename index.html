
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PKR Pricing Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Pricing Calculator</h1>

        <p class="subtitle">
            Calculate your total price with discount and tax
        </p>


        <div class="calculator">

            <!-- Input Section -->
            <div class="input-section">

                <h2>Order Details</h2>

                <form id="pricingForm">

                    <label for="plan">Select Plan</label>

                    <select id="plan">
                        <option value="5000">Basic - PKR 5,000</option>
                        <option value="10000">Standard - PKR 10,000</option>
                        <option value="15000">Premium - PKR 15,000</option>
                    </select>


                    <label for="quantity">Quantity</label>

                    <input
                        type="number"
                        id="quantity"
                        min="1"
                        value="1"
                    >


                    <label for="tax">Tax (%)</label>

                    <input
                        type="number"
                        id="tax"
                        min="0"
                        value="10"
                    >


                    <button type="submit">
                        Calculate Price
                    </button>

                </form>

            </div>


            <!-- Result Section -->
            <div class="result-section">

                <h2>Price Summary</h2>

                <div class="price-row">
                    <span>Price per item</span>
                    <span id="price">PKR 0</span>
                </div>


                <div class="price-row">
                    <span>Quantity</span>
                    <span id="quantityResult">0</span>
                </div>


                <div class="price-row">
                    <span>Subtotal</span>
                    <span id="subtotal">PKR 0</span>
                </div>


                <div class="price-row">
                    <span>Discount</span>
                    <span id="discount">PKR 0</span>
                </div>


                <div class="price-row">
                    <span>Tax</span>
                    <span id="taxAmount">PKR 0</span>
                </div>


                <hr>


                <div class="total-row">
                    <span>Total</span>
                    <span id="total">PKR 0</span>
                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
